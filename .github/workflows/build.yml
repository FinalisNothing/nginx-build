```yaml
name: Build Nginx 1.29.3 for Debian 12

on:
  workflow_dispatch:
    inputs:
      fake_server_name:
        description: "伪装服务器名称"
        required: true
        default: "Microsoft-IIS"
      fake_version:
        description: "伪装版本号"
        required: true
        default: "10.0"
      fake_version_code:
        description: "版本代码"
        required: true
        default: "1000000"

jobs:
  build-nginx:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build in Debian 12
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace debian:12 /bin/bash -c '
          set -e
          echo "===== 开始构建 Nginx 1.29.3 ====="
          
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git wget curl cmake autoconf automake libtool \
            pkg-config libssl-dev zlib1g-dev libpcre3-dev perl golang-go ca-certificates
          
          mkdir -p /opt/nginx && cd /opt/nginx
          
          echo "===== 下载依赖库 ====="
          git clone --depth 1 https://github.com/quictls/openssl.git
          
          git clone --depth 1 https://github.com/jemalloc/jemalloc.git
          cd jemalloc && ./autogen.sh && make -j$(nproc) && make install && make clean
          ln -sf /usr/local/lib/libjemalloc.so.2 /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
          ldconfig && cd /opt/nginx
          
          git clone --depth 1 https://github.com/google/ngx_brotli.git
          cd ngx_brotli && git submodule update --init && cd /opt/nginx
          
          git clone --depth 1 https://github.com/facebook/zstd.git
          cd zstd && make -j$(nproc) && make install && make clean && ldconfig && cd /opt/nginx
          
          git clone --depth 1 https://github.com/tokers/zstd-nginx-module.git ngx_zstd
          
          git clone --depth 1 https://github.com/PCRE2Project/pcre2.git
          cd pcre2 && ./autogen.sh && ./configure && make -j$(nproc) && make install && make clean && ldconfig && cd /opt/nginx
          
          echo "===== 下载 Nginx 1.29.3 ====="
          wget https://nginx.org/download/nginx-1.29.3.tar.gz
          tar -zxf nginx-1.29.3.tar.gz && cd nginx-1.29.3
          
          echo "===== 修改源码隐藏版本 ====="
          sed -i "s/#define nginx_version      [0-9]*/#define nginx_version      ${{ github.event.inputs.fake_version_code }}/g" src/core/nginx.h
          sed -i "s/#define NGINX_VERSION      \".*\"/#define NGINX_VERSION      \"${{ github.event.inputs.fake_version }}\"/g" src/core/nginx.h
          sed -i "s/#define NGINX_VER          \"nginx\/\" NGINX_VERSION/#define NGINX_VER          \"${{ github.event.inputs.fake_server_name }}\/\" NGINX_VERSION/g" src/core/nginx.h
          sed -i "s/#define NGINX_VAR          \"NGINX\"/#define NGINX_VAR          \"${{ github.event.inputs.fake_server_name }}\"/g" src/core/nginx.h
          sed -i "s/static u_char ngx_http_server_string\[\] = \"Server: nginx\" CRLF;/static u_char ngx_http_server_string[] = \"Server: ${{ github.event.inputs.fake_server_name }}\" CRLF;/g" src/http/ngx_http_header_filter_module.c
          sed -i "s/<hr><center>nginx<\/center>/<hr><center>${{ github.event.inputs.fake_server_name }}<\/center>/g" src/http/ngx_http_special_response.c
          sed -i "s/\"<hr><center>\" NGINX_VER \"<\/center>\"/\"<hr><center>${{ github.event.inputs.fake_server_name }}<\/center>\"/g" src/http/ngx_http_special_response.c
          sed -i "s/\"<hr><center>\" NGINX_VER_BUILD \"<\/center>\"/\"<hr><center>${{ github.event.inputs.fake_server_name }}<\/center>\"/g" src/http/ngx_http_special_response.c
          
          echo "===== 配置编译 ====="
          ./configure \
            --prefix=/nginx \
            --with-threads --with-file-aio \
            --with-http_v2_module --with-http_v3_module --with-http_ssl_module \
            --with-http_sub_module --with-http_slice_module --with-http_realip_module \
            --with-http_degradation_module --with-http_stub_status_module \
            --with-pcre-jit --with-pcre=../pcre2 \
            --with-stream --with-stream_ssl_module --with-stream_ssl_preread_module \
            --with-openssl=../openssl --add-module=../ngx_zstd --add-module=../ngx_brotli \
            --with-ld-opt="-ljemalloc -Wl,-z,relro,-z,now -flto" \
            --with-openssl-opt="no-weak-ssl-ciphers enable-ec_nistp_64_gcc_128 enable-tls1_3 enable-quic" \
            --with-cc-opt="-O3 -march=x86-64 -mtune=generic -funroll-loops -fstack-protector-strong -D_FORTIFY_SOURCE=2 -fPIC -pipe -flto"
          
          echo "===== 开始编译 ====="
          make -j$(nproc)
          
          objs/nginx -V 2>&1 | tee /opt/nginx/nginx_build_info.txt
          cp objs/nginx /workspace/nginx
          cp /opt/nginx/nginx_build_info.txt /workspace/
          
          echo "===== 构建完成！ ====="
        '

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: nginx-debian12-hidden
        path: |
          ${{ github.workspace }}/nginx
          ${{ github.workspace }}/nginx_build_info.txt
        retention-days: 90
```
