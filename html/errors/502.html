<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>502 - Service Temporarily Unavailable</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f5f5;color:#333;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{text-align:center;max-width:480px;padding:40px 24px}
.code{font-size:72px;font-weight:700;color:#d32f2f;line-height:1}
.title{font-size:20px;font-weight:600;margin:16px 0 8px;color:#222}
.message{font-size:15px;color:#666;line-height:1.6}
.retry{display:inline-block;margin-top:24px;padding:10px 28px;background:#1976d2;color:#fff;text-decoration:none;border-radius:4px;font-size:14px;font-weight:500;transition:background .2s}
.retry:hover{background:#1565c0}
</style>
</head>
<body>
<div class="container">
<div class="code">502</div>
<div class="title">Service Temporarily Unavailable</div>
<div class="message">The service is currently unable to handle this request. This is usually temporary &mdash; please try again in a moment.</div>
<a class="retry" href="">Retry</a>
</div>
</body>
</html>
